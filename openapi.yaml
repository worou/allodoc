openapi: 3.2.0
info:
  title: 'AlloDoc API'
  description: 'Prise de rendez-vous medicaux - Mali, Burkina Faso, Niger'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
    description: 'Développement local'
paths:
  /api/pro/subscription:
    get:
      operationId: proSubscription
      tags:
        - Abonnement
      responses:
        '200':
          description: État
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '404':
          description: 'Aucune fiche praticien liée'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'État de mon abonnement'
      description: 'Publication, date de fin, jours restants, formules, moyens de paiement, compte marchand du pays, commande en attente et historique.'
      parameters: []
      security:
        -
          bearerAuth: []
  /api/pro/subscriptions:
    post:
      operationId: proOrderSubscription
      tags:
        - Abonnement
      responses:
        '201':
          description: 'Commande créée'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '422':
          description: 'Formule ou moyen de paiement invalide'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Commander ou renouveler'
      description: "Crée une commande en attente avec une référence (AD-XXXXXX) à indiquer dans le transfert mobile money. Remplace une éventuelle commande en attente. À la confirmation du paiement, la période démarre à la fin de l'abonnement en cours (renouvellement anticipé sans perte) ou immédiatement."
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionOrder'
        required: true
      security:
        -
          bearerAuth: []
  '/api/pro/subscriptions/{id}/cancel':
    post:
      operationId: proCancelSubscription
      tags:
        - Abonnement
      responses:
        '200':
          description: 'Commande annulée'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '409':
          description: 'Commande déjà traitée'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Annuler une commande en attente'
      description: ''
      parameters:
        -
          name: id
          in: path
          description: 'Identifiant du rendez-vous (UUID)'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
      security:
        -
          bearerAuth: []
  '/api/pro/subscriptions/{id}/simulate-payment':
    post:
      operationId: proSimulatePayment
      tags:
        - Abonnement
      responses:
        '200':
          description: Payé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
      summary: 'Simuler le paiement (environnement dev uniquement)'
      description: 'Renvoie 404 hors environnement de développement.'
      parameters:
        -
          name: id
          in: path
          description: 'Identifiant du rendez-vous (UUID)'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
      security:
        -
          bearerAuth: []
  /api/admin/practitioners:
    get:
      operationId: adminPractitioners
      tags:
        - Administration
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPractitioners'
        '403':
          description: 'Rôle administrateur requis'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Praticiens à valider'
      description: "Filtré sur le pays de l'administrateur pays."
      parameters:
        -
          name: status
          in: query
          description: 'Statut de vérification'
          required: false
          deprecated: false
          schema:
            type: string
            enum:
              - pending
              - verified
              - rejected
            default: pending
          style: form
          explode: true
      security:
        -
          bearerAuth: []
  '/api/admin/practitioners/{id}/verification':
    post:
      operationId: adminDecide
      tags:
        - Administration
      responses:
        '200':
          description: 'Décision enregistrée'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '404':
          description: 'Introuvable ou hors de votre pays'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Valider ou rejeter un praticien'
      description: "Après contrôle du numéro d'inscription à l'ordre. Action tracée dans le journal d'audit."
      parameters:
        -
          name: id
          in: path
          description: 'Identifiant du praticien'
          required: true
          deprecated: false
          schema:
            type: integer
          style: simple
          explode: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
        required: true
      security:
        -
          bearerAuth: []
  /api/admin/subscriptions:
    get:
      operationId: adminSubscriptions
      tags:
        - Administration
      responses:
        '200':
          description: 'Liste et total'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscriptions'
      summary: "Commandes d'abonnement"
      description: "Limitées au pays de l'administrateur. Les commandes impayées depuis plus de 14 jours sont annulées automatiquement."
      parameters:
        -
          name: status
          in: query
          description: Statut
          required: false
          deprecated: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - cancelled
            default: pending
          style: form
          explode: true
      security:
        -
          bearerAuth: []
  '/api/admin/subscriptions/{id}/confirm':
    post:
      operationId: adminConfirmPayment
      tags:
        - Administration
      responses:
        '200':
          description: Payé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: 'Introuvable ou hors de votre pays'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Déjà traité'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Confirmer la réception du paiement'
      description: "Publie le praticien et lui envoie un SMS. Tracé dans le journal d'audit."
      parameters:
        -
          name: id
          in: path
          description: 'Identifiant du rendez-vous (UUID)'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmation'
        required: true
      security:
        -
          bearerAuth: []
  '/api/admin/subscriptions/{id}/reject':
    post:
      operationId: adminRejectPayment
      tags:
        - Administration
      responses:
        '200':
          description: Annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: 'Introuvable ou déjà traitée'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Refuser une commande'
      description: ''
      parameters:
        -
          name: id
          in: path
          description: 'Identifiant du rendez-vous (UUID)'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: simple
          explode: false
      security:
        -
          bearerAuth: []
  '/api/countries/{code}/overview':
    get:
      operationId: countryOverview
      tags:
        - Annuaire
      responses:
        '200':
          description: "Vue d'ensemble"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryOverview'
        '404':
          description: 'Pays inconnu'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: "Page d'accueil d'un pays"
      description: 'Régions (avec nombre de praticiens vérifiés et indicateur provisoire) et spécialités disponibles. Cache public 5 minutes.'
      parameters:
        -
          name: code
          in: path
          description: 'Code ISO du pays'
          required: true
          deprecated: false
          schema:
            type: string
            enum:
              - ML
              - BF
              - NE
          style: simple
          explode: false
          example: ML
  '/api/practitioners/{slug}':
    get:
      operationId: getPractitioner
      tags:
        - Annuaire
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PractitionerDetail'
        '404':
          description: Introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Fiche praticien'
      description: 'Uniquement les praticiens vérifiés.'
      parameters:
        -
          name: slug
          in: path
          description: 'Identifiant lisible du praticien'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
          example: boubacar-coulibaly
  '/api/practitioners/{slug}/slots':
    get:
      operationId: getPractitionerSlots
      tags:
        - Annuaire
      responses:
        '200':
          description: 'Créneaux par jour'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDays'
        '404':
          description: Introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Créneaux libres'
      description: 'Calculés à partir des horaires récurrents, des congés et des rendez-vous pris, dans le fuseau du pays. `start` est en UTC.'
      parameters:
        -
          name: slug
          in: path
          description: 'Identifiant lisible du praticien'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
          example: boubacar-coulibaly
        -
          name: from
          in: query
          description: 'Premier jour (YYYY-MM-DD)'
          required: false
          deprecated: false
          schema:
            type: string
            format: date
          style: form
          explode: true
        -
          name: days
          in: query
          description: 'Nombre de jours (1 à 14)'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 7
          style: form
          explode: true
  /api/search:
    get:
      operationId: searchPractitioners
      tags:
        - Annuaire
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
      summary: 'Rechercher des praticiens'
      description: 'Résultats paginés ; chaque praticien inclut sa grille de créneaux sur `days` jours et sa prochaine disponibilité.'
      parameters:
        -
          name: country
          in: query
          description: 'Code pays'
          required: false
          deprecated: false
          schema:
            type: string
            enum:
              - ML
              - BF
              - NE
          style: form
          explode: true
          example: ML
        -
          name: region
          in: query
          description: 'Slug de région'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
          example: district-de-bamako
        -
          name: city
          in: query
          description: 'Nom exact de la ville'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
          example: Bamako
        -
          name: specialty
          in: query
          description: 'Slug de spécialité'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
          example: pediatrie
        -
          name: q
          in: query
          description: 'Texte libre : nom du praticien ou de la structure'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: teleconsultation
          in: query
          description: 'Uniquement la téléconsultation'
          required: false
          deprecated: false
          schema:
            type: boolean
          style: form
          explode: true
        -
          name: language
          in: query
          description: 'Langue parlée (fr, bm, mos, ha, dje, ff, en…)'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
          example: bm
        -
          name: insurance
          in: query
          description: 'Assurance acceptée'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
          example: AMO
        -
          name: from
          in: query
          description: "Premier jour de la grille (YYYY-MM-DD, défaut : aujourd'hui)"
          required: false
          deprecated: false
          schema:
            type: string
            format: date
          style: form
          explode: true
        -
          name: days
          in: query
          description: 'Nombre de jours de la grille (1 à 7)'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 5
          style: form
          explode: true
        -
          name: page
          in: query
          description: Page
          required: false
          deprecated: false
          schema:
            type: integer
            default: 1
          style: form
          explode: true
        -
          name: perPage
          in: query
          description: 'Résultats par page (1 à 20)'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 10
          style: form
          explode: true
  /api/auth/oauth/exchange:
    post:
      operationId: oauthExchange
      tags:
        - Authentification
      responses:
        '200':
          description: Connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: 'Code expiré ou déjà utilisé'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Échanger le code à usage unique contre un jeton'
      description: 'Code valable 60 secondes et une seule fois, uniquement avec le nonce fourni au démarrage (protection contre un lien de retour transmis par un tiers).'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchange'
        required: true
  /api/auth/oauth/providers:
    get:
      operationId: oauthProviders
      tags:
        - Authentification
      responses:
        '200':
          description: Fournisseurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviders'
      summary: 'Fournisseurs de connexion (Google, GitHub)'
      description: '`configured: false` tant que les identifiants OAuth ne sont pas renseignés sur le serveur.'
      parameters: []
  '/api/auth/oauth/{provider}':
    get:
      operationId: oauthStart
      tags:
        - Authentification
      responses:
        '302':
          description: 'Redirection vers le fournisseur'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
      summary: 'Démarrer la connexion Google ou GitHub (navigation, pas fetch)'
      description: "À ouvrir par une navigation complète du navigateur. Pose un cookie HttpOnly (state anti-CSRF, PKCE) puis redirige (302) vers le fournisseur. Au retour, l'API redirige vers `FRONTEND_URL/connexion/oauth?code=…&next=…` (succès) ou `FRONTEND_URL/connexion?oauth_error=…` (échec)."
      parameters:
        -
          name: provider
          in: path
          description: Fournisseur
          required: true
          deprecated: false
          schema:
            type: string
            enum:
              - google
              - github
          style: simple
          explode: false
        -
          name: next
          in: query
          description: 'Chemin du front où revenir après connexion (doit commencer par /)'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
          example: /compte
        -
          name: nonce
          in: query
          description: 'Valeur aléatoire (16 à 128 caractères [A-Za-z0-9_-]) générée par le front et gardée en sessionStorage ; à renvoyer à /exchange'
          required: true
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
  '/api/auth/oauth/{provider}/callback':
    get:
      operationId: oauthCallback
      tags:
        - Authentification
      responses:
        '302':
          description: 'Redirection vers le front'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
      summary: 'Retour du fournisseur (adresse à déclarer chez Google / GitHub)'
      description: "Vérifie le state, récupère l'identité, retrouve ou crée le compte. Rattachement à un compte existant uniquement via un identifiant fournisseur connu ou une adresse email vérifiée des deux côtés."
      parameters:
        -
          name: provider
          in: path
          description: Fournisseur
          required: true
          deprecated: false
          schema:
            type: string
            enum:
              - google
              - github
          style: simple
          explode: false
        -
          name: code
          in: query
          description: "Code d'autorisation du fournisseur"
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: state
          in: query
          description: 'Valeur anti-CSRF'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
  /api/auth/otp/request:
    post:
      operationId: otpRequest
      tags:
        - Authentification
      responses:
        '200':
          description: 'Code envoyé'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
        '422':
          description: 'Numéro invalide'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Trop de demandes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Envoyer un code de connexion par SMS ou par email'
      description: 'Corps `{"phone", "country"}` (SMS) ou `{"email"}` (email). Envoie un code à 6 chiffres valable 10 minutes. Limites : 3 demandes / 10 min par numéro ou adresse, 20 / heure par IP. En environnement dev, le code est renvoyé dans `devCode`.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
        required: true
  /api/auth/otp/verify:
    post:
      operationId: otpVerify
      tags:
        - Authentification
      responses:
        '200':
          description: Connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: 'Code incorrect ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Trop de tentatives'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: 'Vérifier le code et obtenir un jeton'
      description: "Crée le compte au premier passage. Par email, l'adresse devient vérifiée et le compte n'a pas encore de téléphone : il faut en ajouter un via POST /api/me/phone avant de réserver. Jeton valable 30 jours, 5 essais maximum par code."
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
        required: true
  /api/cities:
    get:
      operationId: api_cities_get_collection
      tags:
        - City
      responses:
        '200':
          description: 'City collection'
          content:
            application/ld+json:
              schema:
                type: object
                description: 'City.jsonld-city.read collection.'
                allOf:
                  - { $ref: '#/components/schemas/HydraCollectionBaseSchemaNoPagination' }
                  - { type: object, required: [member], properties: { member: { type: array, items: { $ref: '#/components/schemas/City.jsonld-city.read' } } } }
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City-city.read'
      summary: 'Retrieves the collection of City resources.'
      description: 'Retrieves the collection of City resources.'
      parameters:
        -
          name: region.country.code
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'region.country.code[]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        -
          name: region.slug
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'region.slug[]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
  '/api/cities/{id}':
    get:
      operationId: api_cities_id_get
      tags:
        - City
      responses:
        '200':
          description: 'City resource'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/City.jsonld-city.read'
            application/json:
              schema:
                $ref: '#/components/schemas/City-city.read'
        '404':
          description: 'Not found'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Retrieves a City resource.'
      description: 'Retrieves a City resource.'
      parameters:
        -
          name: id
          in: path
          description: 'City identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  /api/countries:
    get:
      operationId: api_countries_get_collection
      tags:
        - Country
      responses:
        '200':
          description: 'Country collection'
          content:
            application/ld+json:
              schema:
                type: object
                description: 'Country.jsonld-country.read collection.'
                allOf:
                  - { $ref: '#/components/schemas/HydraCollectionBaseSchemaNoPagination' }
                  - { type: object, required: [member], properties: { member: { type: array, items: { $ref: '#/components/schemas/Country.jsonld-country.read' } } } }
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country-country.read'
      summary: 'Retrieves the collection of Country resources.'
      description: 'Retrieves the collection of Country resources.'
      parameters: []
  '/api/countries/{code}':
    get:
      operationId: api_countries_code_get
      tags:
        - Country
      responses:
        '200':
          description: 'Country resource'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Country.jsonld-country.read'
            application/json:
              schema:
                $ref: '#/components/schemas/Country-country.read'
        '404':
          description: 'Not found'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Retrieves a Country resource.'
