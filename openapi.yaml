components:
  schemas:
    City-city.read:
      type: object
      properties:
        id:
          readOnly: true
          type: integer
        region:
          $ref: '#/components/schemas/Region-city.read'
        name:
          type: string
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
    City.jsonld-city.read:
      allOf:
        -
          $ref: '#/components/schemas/HydraItemBaseSchema'
        -
          type: object
          properties:
            id:
              readOnly: true
              type: integer
            region:
              $ref: '#/components/schemas/Region.jsonld-city.read'
            name:
              type: string
            latitude:
              type:
                - number
                - 'null'
            longitude:
              type:
                - number
                - 'null'
    Country-country.read:
      type: object
      description: 'Pays couvert par la plateforme. Ajouter un pays = ajouter une ligne en base, aucun code en dur.'
      properties:
        code:
          description: "Code ISO 3166-1 alpha-2 (ML, BF, NE), sert d'identifiant dans l'API."
          type: string
        name:
          type: string
        capital:
          type: string
        timezone:
          description: 'Fuseau IANA : Africa/Bamako, Africa/Ouagadougou, Africa/Niamey.'
          type: string
        phonePrefix:
          type: string
        currency:
          readOnly: true
          default: XOF
          type: string
        languages:
          description: 'Langues courantes (codes ISO 639) : fr, bm, mos, ha, dje, ff.'
          type: array
          items:
            type:
              - string
              - 'null'
        active:
          readOnly: true
          default: true
          type: boolean
    Country-region.read:
      type: object
      properties:
        code:
          description: "Code ISO 3166-1 alpha-2 (ML, BF, NE), sert d'identifiant dans l'API."
          type: string
        name:
          type: string
    Country.jsonld-country.read:
      allOf:
        -
          $ref: '#/components/schemas/HydraItemBaseSchema'
        -
          type: object
          properties:
            code:
              description: "Code ISO 3166-1 alpha-2 (ML, BF, NE), sert d'identifiant dans l'API."
              type: string
            name:
              type: string
            capital:
              type: string
            timezone:
              description: 'Fuseau IANA : Africa/Bamako, Africa/Ouagadougou, Africa/Niamey.'
              type: string
            phonePrefix:
              type: string
            currency:
              readOnly: true
              default: XOF
              type: string
            languages:
              description: 'Langues courantes (codes ISO 639) : fr, bm, mos, ha, dje, ff.'
              type: array
              items:
                type:
                  - string
                  - 'null'
            active:
              readOnly: true
              default: true
              type: boolean
      description: 'Pays couvert par la plateforme. Ajouter un pays = ajouter une ligne en base, aucun code en dur.'
    Country.jsonld-region.read:
      allOf:
        -
          $ref: '#/components/schemas/HydraItemBaseSchema'
        -
          type: object
          properties:
            code:
              description: "Code ISO 3166-1 alpha-2 (ML, BF, NE), sert d'identifiant dans l'API."
              type: string
            name:
              type: string
      description: 'Pays couvert par la plateforme. Ajouter un pays = ajouter une ligne en base, aucun code en dur.'
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Ce créneau n'est plus disponible."
        code:
          type: string
          example: consent_required
      required:
        - error
    Error.jsonld:
      allOf:
        -
          $ref: '#/components/schemas/HydraItemBaseSchema'
        -
          type: object
          properties:
            title:
              readOnly: true
              description: 'A short, human-readable summary of the problem.'
              type:
                - string
                - 'null'
            detail:
              readOnly: true
              description: 'A human-readable explanation specific to this occurrence of the problem.'
              type:
                - string
                - 'null'
            status:
              type:
                - integer
                - 'null'
              examples:
                - 404
              default: 400
            instance:
              readOnly: true
              description: 'A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.'
              type:
                - string
                - 'null'
            type:
              readOnly: true
              description: 'A URI reference that identifies the problem type'
              type: string
            description:
              readOnly: true
              type:
                - string
                - 'null'
      description: 'A representation of common errors.'
    Facility-facility.read:
